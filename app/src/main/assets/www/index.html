<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rita</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="sky">
    <div class="clouds" aria-hidden="true"></div>
    <div class="head-row">
      <div class="logo">Rita <span class="heart">&#9829;</span></div>
      <div class="sign fr f-wood"><span id="date"></span></div>
    </div>
    <div id="daycount" class="daycount"></div>
    <div class="grass" aria-hidden="true"></div>
  </header>

  <main>
    <section id="view-today">
      <div class="dialog-wrap">
        <div class="nametag fr f-dose">&#9829; Rita</div>
        <div id="status" class="dialog fr f-wood"></div>
      </div>
      <div id="steps" class="steps"></div>
      <div id="meds" class="meds"></div>
      <div class="panel fr f-wood">
        <div class="ptitle">ma journée</div>
        <div id="today-bar"></div>
        <div class="legend">
          <span><i style="background:#ffb8cb"></i>montée</span>
          <span><i style="background:#bfe6a6"></i>plateau</span>
          <span><i style="background:#ffc9a3"></i>descente</span>
        </div>
      </div>
      <button id="today-extra" class="extra fr f-off"></button>
    </section>

    <section id="view-mood" hidden>
      <div class="dialog-wrap">
        <div class="nametag fr f-mood">&#9829; humeur</div>
        <div id="mood-status" class="dialog fr f-wood"></div>
      </div>
      <div id="crisis" class="crisis"></div>
      <div class="panel fr f-wood pick">
        <div class="ptitle">humeur</div>
        <div id="mood-row" class="pick-row"></div>
        <div class="ptitle">énergie</div>
        <div id="energy-row" class="pick-row"></div>
      </div>
      <div id="mood-ctx" class="panel fr f-wood" hidden>
        <div id="mood-ctx-title" class="ptitle"></div>
        <div id="mood-ctx-chips" class="chips"></div>
        <button id="mood-ctx-note" class="extra fr f-off"></button>
      </div>
      <div class="panel fr f-wood">
        <div class="ptitle">aujourd'hui</div>
        <div id="mood-chart" class="chart-box"></div>
        <div class="legend">
          <span><i style="background:#e0668c"></i>humeur</span>
          <span><i style="background:#d99a1e"></i>énergie</span>
          <span><i style="background:#ffe6ee"></i>ritaline</span>
          <span><i style="background:#d3c4f3"></i>crise</span>
        </div>
      </div>
      <div id="mood-list" class="mood-list"></div>
    </section>

    <section id="view-journal" hidden>
      <div id="jtabs" class="subtabs"></div>
      <div id="jperiod" class="period"></div>
      <div id="jbody"></div>
    </section>
  </main>

  <nav class="tabs">
    <button data-view="today" class="tab fr f-wood on">rita</button>
    <button data-view="mood" class="tab fr f-off">humeur</button>
    <button data-view="journal" class="tab fr f-off">journal</button>
  </nav>

  <div id="toast" class="toast fr f-wood" hidden>
    <span id="toast-msg"></span>
    <button id="toast-undo" class="btn small fr f-dose">annuler</button>
  </div>

  <div id="breath" class="breath" hidden></div>

  <div id="sheet" class="sheet" hidden>
    <div id="sheet-box" class="sheet-box fr f-wood"></div>
  </div>
</div>
<script src="sprites.js"></script>
<script src="charts.js"></script>
<script src="meds.js"></script>
<script src="crises.js"></script>
<script src="journal.js"></script>
<script src="app.js"></script>
</body>
</html>
