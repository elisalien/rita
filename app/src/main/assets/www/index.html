<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Rita</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">
  <header class="sky">
    <div class="clouds" aria-hidden="true"></div>
    <div class="head-row">
      <div class="logo">Rita <span class="heart">&#9829;</span></div>
      <div class="sign fr f-wood"><span id="date"></span></div>
    </div>
    <div id="daycount" class="daycount"></div>
    <div class="grass" aria-hidden="true"></div>
  </header>

  <main>
    <section id="view-today">
      <div class="dialog-wrap">
        <div class="nametag fr f-dose">&#9829; Rita</div>
        <div id="status" class="dialog fr f-wood"></div>
      </div>
      <div id="steps" class="steps"></div>
      <div class="panel fr f-wood">
        <div class="ptitle">ma journée</div>
        <div id="today-bar"></div>
        <div class="legend">
          <span><i style="background:#ffb8cb"></i>montée</span>
          <span><i style="background:#bfe6a6"></i>plateau</span>
          <span><i style="background:#ffc9a3"></i>descente</span>
        </div>
      </div>
      <button id="today-extra" class="extra fr f-off"></button>
    </section>

    <section id="view-journal" hidden>
      <div id="averages" class="panel fr f-wood"></div>
      <div id="days" class="days"></div>
      <div class="row">
        <button id="add-day" class="btn fr f-peak">+ un jour</button>
        <button id="export" class="btn fr f-off">exporter</button>
        <button id="import" class="btn fr f-off">importer</button>
      </div>
      <p class="fine">Tes données restent sur ton téléphone. Rien n'est envoyé nulle part.</p>
    </section>
  </main>

  <nav class="tabs">
    <button data-view="today" class="tab fr f-wood on">aujourd'hui</button>
    <button data-view="journal" class="tab fr f-off">journal</button>
  </nav>

  <div id="toast" class="toast fr f-wood" hidden>
    <span id="toast-msg"></span>
    <button id="toast-undo" class="btn small fr f-dose">annuler</button>
  </div>

  <div id="sheet" class="sheet" hidden>
    <div id="sheet-box" class="sheet-box fr f-wood"></div>
  </div>
</div>
<script src="sprites.js"></script>
<script src="app.js"></script>
</body>
</html>
